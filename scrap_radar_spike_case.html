<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scrap Radar • SPIKE Handoff</title>
<style>html,body,#sr{margin:0;width:100%;height:100%;border:0;background:#020803}body{overflow:hidden}#sr{display:block}</style>
</head>
<body>
<iframe id="sr" src="scrap_radar.html?build=27&source=spike#board-recovery" title="Scrap Radar SPIKE Recovery Handoff"></iframe>
<script>
(function(){
  var frame=document.getElementById('sr');
  function add(d,id,src){if(d.getElementById(id))return;var s=d.createElement('script');s.id=id;s.src=src;s.async=false;d.body.appendChild(s)}
  function jumpToTargets(tries){
    if(location.hash!=='#recovery-targets')return;
    var target=frame.contentDocument&&frame.contentDocument.getElementById('br-break-even');
    if(target){
      target.scrollIntoView({behavior:'auto',block:'start'});
      setTimeout(function(){if(location.hash==='#recovery-targets')target.scrollIntoView({behavior:'auto',block:'start'})},500);
      return;
    }
    if(tries<60)setTimeout(function(){jumpToTargets(tries+1)},100);
  }
  frame.addEventListener('load',function(){
    try{
      var d=frame.contentDocument;if(!d)return;
      add(d,'srCriticalDirect','scrap_radar_critical.js?v=1');
      add(d,'srCriticalHelpDirect','scrap_radar_critical_help.js?v=2');
      add(d,'srSourceFinderDirect','scrap_radar_source_finder.js?v=1');
      add(d,'spikeScrapImporterLoader','scrap_radar_spike_bridge.js?v=13');
      add(d,'spikeGoldScenarioLoader','scrap_radar_gold_scenario.js?v=4');
      jumpToTargets(0);
    }catch(e){console.error('SPIKE Scrap Radar handoff injection failed',e)}
  });
  window.addEventListener('hashchange',function(){jumpToTargets(0)});
})();
</script>
</body>
</html>
