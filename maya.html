<title>Maya AI Mission Control</title>

<style>
.maya-office-header{padding:42px 18px 6px}.maya-portrait-frame{width:240px;height:240px;margin:0 auto 18px;border-radius:50%;padding:7px;background:linear-gradient(145deg,#00ff99,#7fffd4,#bb66ff);box-shadow:0 0 28px rgba(0,255,153,.75),0 0 65px rgba(187,102,255,.28)}.maya-portrait{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 28%;background:#07140f;border:4px solid #07140f;box-sizing:border-box}.maya-office-header h1{margin:0;color:#00ff99;font-size:clamp(2.8rem,9vw,5.2rem);text-shadow:0 0 25px #00ff99}.maya-office-header .office-label{margin:8px 0 0;color:#baffdf;font-size:.82rem;font-weight:800;letter-spacing:.32em}.maya-nameplate{width:min(420px,86vw);margin:18px auto 24px;padding:10px 14px;border:1px solid rgba(0,255,153,.45);border-radius:10px;background:rgba(0,28,20,.8);color:#dffff2;font-weight:800;letter-spacing:.08em;box-shadow:0 0 20px rgba(0,255,153,.16)}@media(max-width:520px){.maya-portrait-frame{width:195px;height:195px}.maya-office-header{padding-top:28px}}
</style>
</head>
