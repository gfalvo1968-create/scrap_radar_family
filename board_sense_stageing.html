<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Board Sense Staging</title><style>html,body,#bs{margin:0;width:100%;height:100%;border:0;background:#050505}body{overflow:hidden}#bs{display:block}</style></head><body><iframe id="bs" src="board_sense.html?v=case38" title="Board Sense Staging"></iframe><script>
(function(){
  var frame=document.getElementById('bs');
  var STAGING_API='https://boardsensestaging-staging.up.railway.app';
  var TESTER_STORAGE_KEY='boardSenseTesterKeyV1';
  function add(d,id,src,onload){if(d.getElementById(id)){if(onload)onload();return}var s=d.createElement('script');s.id=id;s.src=src;s.async=false;if(onload)s.onload=onload;d.body.appendChild(s)}
  function diagnosticGate(data){var x=(data&&data.combined)||data||{};return x.same_board_verification||(x.case_analysis&&x.case_analysis.identity_gate)||x.identity||null}
  function esc(v){return String(v==null?'':v).replace(/[&<>]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]})}
  function isIndependentWholeRequest(r){return !!r&&(r.request_type==='independent_whole_board_identity_photo'||r.detector_reason==='insufficient_independent_whole_board_evidence')}
  function showDiagnostics(d,data){
    var old=d.getElementById('stagingFrameDiagnostics');if(old)old.remove();
    var gate=diagnosticGate(data);if(!gate)return;
    var combinedCase=(data&&data.combined)||{};
    // Operator testimony is accepted, but does not establish independent
    // physical matching. Explain the hold rather than requesting it again.
    if(gate.status==='OPERATOR_CONFIRMED_SAME_BOARD' &&
       combinedCase.status==='case_identity_failed' &&
       combinedCase.requires_manual_board_verification===true &&
       !gate.block_reconciliation){
      setTimeout(function(){
        var u=d.getElementById('uploadStatus');
        if(u && u.textContent.indexOf('Case paused: same-board identity is uncertain')===0){
          u.textContent='Your confirmation was accepted. Independent physical matching remains unverified. Combined grading is withheld. Use single-photo inspection or add a new independent full-board view; repeating confirmation will not resolve this.';
        }
      },250);
    }

    if(gate.status==='IDENTITY_CLARIFICATION_NEEDED'){
      var request=(gate.requested_photos&&gate.requested_photos[0])||{};
      var instruction=request.instruction||gate.identity_next_step||'Add the targeted identity photo SPIKE requested.';
      var independentWhole=isIndependentWholeRequest(request);
      setTimeout(function(){
        var u=d.getElementById('uploadStatus');if(u)u.textContent='Identity clarification needed. '+instruction;
        var p=d.getElementById('predictionBox');
        if(p){
          if(independentWhole){
            p.innerHTML='<div class="decision-box"><h3>📸 SPIKE NEEDS A GENUINELY NEW VIEW</h3><b>No same-board approval yet.</b><br>The current uploads do not provide two independent usable whole-board identity views. Crops, digital zooms, and near-duplicate views may help inspection, but they do not count as separate physical witnesses.<br><br><b>Next photo:</b> '+esc(instruction)+'<br><br><span class="muted">Board grading stays paused until identity is settled.</span></div>';
          }else{
            p.innerHTML='<div class="decision-box"><h3>📸 SPIKE NEEDS ONE BETTER VIEW</h3><b>No multiple-board claim yet.</b><br>SPIKE found a narrow-neck shape ambiguity, but not enough independent evidence to call this two boards.<br><br><b>Next photo:</b> '+esc(instruction)+'<br><br><span class="muted">Board grading stays paused until identity is settled.</span></div>';
          }
        }
      },250);
    }
    var blocks=gate.frame_blocks||[];
    var panel=d.createElement('div');panel.id='stagingFrameDiagnostics';
    panel.style.cssText='position:fixed;left:10px;right:10px;bottom:62px;z-index:99998;max-height:42vh;overflow:auto;background:#080808;color:#e8e8e8;border:1px solid #ffd700;border-radius:12px;padding:10px 12px;font:12px/1.4 monospace;box-shadow:0 0 18px rgba(255,215,0,.25)';
    var html='<div style="display:flex;justify-content:space-between;gap:10px"><b style="color:#ffd700">🔬 STAGING FRAME DIAGNOSTICS</b><button id="stagingDiagClose" type="button">×</button></div>';
    html+='<div>Status: '+esc(gate.status||'checked')+' • blocked: '+String(!!gate.block_reconciliation)+'</div>';
    if(gate.status==='IDENTITY_CLARIFICATION_NEEDED'){
      var requests=gate.requested_photos||[];
      var independentLabel=requests.some(isIndependentWholeRequest);
      html+='<div style="margin-top:6px;color:#ffd700"><b>'+(independentLabel?'INDEPENDENT VIEW REQUEST':'CLARIFICATION REQUEST')+'</b></div>';
      requests.forEach(function(r){var prefix=r.flagged_view!=null?'Photo '+esc(r.flagged_view)+': ':'';html+='<div>'+prefix+esc(r.instruction||'Add the requested identity photo.')+'</div>'});
    }
    if(!blocks.length)html+='<div>No blocked frame diagnostics were returned.</div>';
    blocks.forEach(function(b,n){
      var fg=b.frame_identity_gate||b.gate||b||{},m=fg.metrics||{},ev=fg.evidence||[];
      html+='<hr><b>Photo '+esc(b.view!=null?b.view:n+1)+'</b> • '+esc(fg.status||'flagged')+' • detector '+esc(fg.version||fg.detector_version||'n/a');
      html+='<br><b>TRIGGERS</b> two-region='+String(!!m.base_two_region_trigger)+' | bottleneck='+String(!!m.bottleneck_split_trigger)+' | multiscale='+String(!!m.multiscale_split_trigger)+' | secondary-plane='+String(!!m.secondary_plane_trigger);
      if(m.multiscale_split_kernel!=null)html+=' (kernel '+esc(m.multiscale_split_kernel)+')';
      html+='<br><b>MEASUREMENTS</b><pre style="white-space:pre-wrap;margin:4px 0">'+esc(JSON.stringify(m,null,2))+'</pre>';
      if(ev.length)html+='<b>EVIDENCE</b><br>'+ev.map(function(x){return '• '+esc(x)}).join('<br>');
    });
    var combined=(data&&data.combined)||{},tool=combined.spike_tool_use||null,views=(data&&data.views)||[];
    if(views.length){html+='<hr><b style="color:#7dff7d">PHYSICAL FINGERPRINTS</b>';views.forEach(function(v,i){var fp=v.physical_fingerprint||{};html+='<br><b>Photo '+esc(v.view_number||i+1)+'</b> coverage='+esc(fp.coverage||'n/a')+' quality='+esc(fp.geometry_quality||'n/a')+' aspect='+esc(fp.board_aspect==null?'n/a':fp.board_aspect)+' holes='+esc(fp.hole_count==null?'n/a':fp.hole_count)+' landmarks='+esc(fp.landmark_count==null?'n/a':fp.landmark_count)})}
    if(tool){
      html+='<hr><b style="color:#00d4ff">SPIKE TOOL USE</b><br>Status: '+esc(tool.status||'n/a')+'<br>Used: '+esc((tool.tools_used||[]).join(', ')||'none')+'<br>Identity override: '+String(!!tool.identity_override);
      if(tool.independent_whole_view_count!=null)html+='<br>Independent whole-board views: '+esc(tool.independent_whole_view_count);
      if((tool.non_independent_view_pairs||[]).length)html+='<br>Non-independent pairs: '+esc(JSON.stringify(tool.non_independent_view_pairs));
      var searches=tool.web_reference_searches||[];
      searches.forEach(function(s,i){html+='<br><br><b>Web search photo '+esc(s.view||i+1)+'</b> • '+esc(s.status||'n/a');if(s.query)html+='<br>Query: '+esc(s.query);(s.matches||[]).slice(0,3).forEach(function(m){html+='<br>• '+esc(m.title||'untitled')+(m.source?' ['+esc(m.source)+']':'')});if(s.error)html+='<br>Error: '+esc(s.error)});
      if(tool.reference_consensus){html+='<br><br><b>Reference consensus:</b> '+esc(tool.reference_consensus.support||tool.reference_consensus.status||'n/a');if((tool.reference_consensus.common_tokens||[]).length)html+='<br>Common terms: '+esc(tool.reference_consensus.common_tokens.join(', '))}
    }
    panel.innerHTML=html;d.body.appendChild(panel);var x=d.getElementById('stagingDiagClose');if(x)x.onclick=function(){panel.remove()};
  }
  function installTesterAccess(d){
    var w=d.defaultView;if(!w)return;w.API=STAGING_API;
    if(!w.__boardSenseTesterFetchPatched){
      var originalFetch=w.fetch.bind(w);
      w.fetch=function(input,init){
        var target=typeof input==='string'?input:input&&input.url;
        var parsed;try{parsed=new w.URL(target,w.location.href)}catch(_){return originalFetch(input,init)}
        var hosts=['boardsense.scrapradarfamily.com','boardsense-stageing.up.railway.app','boardsensestaging-staging.up.railway.app'];
        if(hosts.indexOf(parsed.hostname)===-1)return originalFetch(input,init);
        if(parsed.protocol!=='https:'||parsed.port)return Promise.reject(new Error('Unsafe staging API target'));
        var url=STAGING_API+parsed.pathname+parsed.search;
        var opts=Object.assign({},init||{});
        var headers=new w.Headers(opts.headers||(input&&input.headers)||{});
        headers.delete('x-board-sense-tester-key');
        if(['/analyze','/analyze-case','/analyze-pair','/analyze-spike-pair'].indexOf(parsed.pathname)!==-1){
          var key='';try{key=w.localStorage.getItem(TESTER_STORAGE_KEY)||''}catch(_){}
          if(key)headers.set('x-board-sense-tester-key',key);
        }
        opts.headers=headers;opts.redirect='error';
        var request=typeof input==='string'?url:new w.Request(url,input);
        return originalFetch(request,opts).then(function(res){
          if(parsed.pathname==='/analyze-case')res.clone().json().then(function(data){showDiagnostics(d,data)}).catch(function(){});
          return res;
        });
      };
      w.__boardSenseTesterFetchPatched=true;
    }
    var banner=d.createElement('div');
    banner.textContent='STAGING ONLY • Target build 6690f73 • '+STAGING_API+' • build verified in Railway, not by this page';
    banner.style.cssText='padding:10px;background:#332600;color:#ffd700;border:1px solid #ffd700;font:bold 13px monospace;overflow-wrap:anywhere';
    d.body.prepend(banner);
    if(d.getElementById('boardSenseTesterAccessBtn'))return;
    var btn=d.createElement('button');btn.id='boardSenseTesterAccessBtn';btn.type='button';var saved='';try{saved=w.localStorage.getItem(TESTER_STORAGE_KEY)||''}catch(_){}btn.textContent=saved?'✅ STAGING • Tester Access Saved':'🧪 STAGING • Tester Access';btn.style.cssText='position:fixed;right:12px;bottom:12px;z-index:99999;padding:10px 14px;border-radius:12px;border:1px solid #ffd700;background:#111;color:#ffd700;font-weight:700;box-shadow:0 0 14px rgba(255,215,0,.35)';btn.onclick=function(){var existing='';try{existing=w.localStorage.getItem(TESTER_STORAGE_KEY)||''}catch(_){}var entered=w.prompt(existing?'Tester access is already saved. Enter a NEW key to replace it. Leave blank to keep it. Type CLEAR to disable.':'Enter the Board Sense tester key.','');if(entered===null)return;entered=String(entered).trim();try{if(existing&&!entered){btn.textContent='✅ STAGING • Tester Access Saved';return}if(entered.toUpperCase()==='CLEAR'){w.localStorage.removeItem(TESTER_STORAGE_KEY);btn.textContent='🧪 STAGING • Tester Access';return}if(entered){w.localStorage.setItem(TESTER_STORAGE_KEY,entered);btn.textContent='✅ STAGING • Tester Access Saved'}}catch(_){w.alert('Tester key could not be saved on this browser.')}};d.body.appendChild(btn)
  }
  function installBoardBreakdown(d){
    if(d.__boardBreakdownInstalled)return;d.__boardBreakdownInstalled=true;
    var w=d.defaultView;if(!w)return;
    var blueprint=d.getElementById('blueprintBox');
    var panel=blueprint&&blueprint.closest('section');
    if(!panel)return;
    var section=d.createElement('section');
    section.className='panel blueprint-panel';
    section.id='boardBreakdownPanel';
    section.innerHTML='<h2>🔎 Close-Up Component Breakdown</h2><p>SPIKE separates the major detected parts into numbered close-ups so the buyer can see what is actually present on the board.</p><div id="boardBreakdownBox"><p class="muted">Analyze a board to generate its component breakdown.</p></div>';
    panel.insertAdjacentElement('afterend',section);
    var style=d.createElement('style');
    style.textContent='.board-breakdown-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.board-breakdown-card{border:1px solid #596900;border-radius:12px;padding:10px;background:#0b0d0d}.board-breakdown-crop{position:relative;overflow:hidden;border:1px solid #cfff00;border-radius:9px;background:#050505;margin-bottom:9px}.board-breakdown-crop img{position:absolute;max-width:none!important}.board-breakdown-title{font-weight:800;font-size:1.02rem;margin-bottom:5px}.board-breakdown-number{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:#d7ff00;color:#050505;margin-right:7px;font-weight:900}.board-breakdown-note{color:#e2cf7a;line-height:1.35}.board-breakdown-guard{margin-top:6px;color:#aaa;font-size:.9rem}';
    d.head.appendChild(style);
    function render(data){
      var box=d.getElementById('boardBreakdownBox');if(!box)return;
      var b=data&&data.board_blueprint||{},items=Array.isArray(b.component_index)?b.component_index:[];
      if(!b.available||!items.length){
        box.innerHTML='<div class="warning-box">Component breakdown unavailable until SPIKE has one safe board view with detector-supported component regions.</div>';return;
      }
      var iw=Number(b.image_width)||0,ih=Number(b.image_height)||0,url=(w.API||STAGING_API)+(b.image_url||'')+'?t='+Date.now();
      var shown=items.slice(0,9);
      box.innerHTML='<div class="board-breakdown-grid">'+shown.map(function(item){
        var q=item.box||{},x=Math.max(0,Number(q.x)||0),y=Math.max(0,Number(q.y)||0),rw=Math.max(1,Number(q.w)||1),rh=Math.max(1,Number(q.h)||1);
        var crop='';
        if(iw>0&&ih>0){
          var pad=Math.max(18,Math.round(Math.max(rw,rh)*.45)),cx=Math.max(0,x-pad),cy=Math.max(0,y-pad),cw=Math.min(iw-cx,rw+pad*2),ch=Math.min(ih-cy,rh+pad*2);
          var imgW=iw/cw*100,left=-cx/cw*100,top=-cy/ch*100;
          crop='<div class="board-breakdown-crop" style="aspect-ratio:'+cw+'/'+ch+'"><img src="'+esc(url)+'" alt="Component '+esc(item.number)+' close-up" style="width:'+imgW+'%;left:'+left+'%;top:'+top+'%"></div>';
        }
        var note=(typeof w.blueprintTip==='function'?w.blueprintTip(item.label):'Inspect this detected region before assigning recovery value.');
        var guard=item.geometry_guard||item.context_guard||'';
        return '<div class="board-breakdown-card">'+crop+'<div class="board-breakdown-title"><span class="board-breakdown-number">'+esc(item.number)+'</span>'+esc(item.label||'Detected component')+'</div>'+(item.confidence!=null?'<div>Detector confidence: '+esc(item.confidence)+'%</div>':'')+'<div class="board-breakdown-note">'+esc(note)+'</div>'+(guard?'<div class="board-breakdown-guard">'+esc(guard)+'</div>':'')+'</div>';
      }).join('')+'</div><p class="muted">Close-ups are inspection aids from the selected safe blueprint view. They do not create new identity evidence or manufacture value.</p>';
    }
    var original=w.renderBoardData;
    if(typeof original==='function'){
      w.renderBoardData=function(data){var out=original.apply(this,arguments);try{render(data)}catch(e){console.error('Board breakdown render failed',e)}return out};
    }
    w.renderBoardBreakdown=render;
  }
  function installTrayPreviews(d){
    if(d.__stagingTrayPreviewsInstalled)return;d.__stagingTrayPreviewsInstalled=true;var urls={};if(d.defaultView)d.defaultView.__boardSenseStagingPreviewUrls=urls;
    function remember(input){Array.prototype.forEach.call((input&&input.files)||[],function(file){try{if(urls[file.name])URL.revokeObjectURL(urls[file.name]);urls[file.name]=URL.createObjectURL(file)}catch(_){}})}
    function paint(){var tray=d.getElementById('caseTray');if(!tray)return;Array.prototype.forEach.call(tray.querySelectorAll('.blueprint-item'),function(row){if(row.querySelector('.staging-file-preview'))return;var title=row.querySelector('.blueprint-title');var name=title?String(title.textContent||'').trim():'';if(!name||!urls[name])return;var img=d.createElement('img');img.className='staging-file-preview';img.src=urls[name];img.alt=name;img.style.cssText='width:88px;height:66px;object-fit:cover;border:1px solid #39ff14;border-radius:8px;margin-right:10px;vertical-align:middle;background:#111';row.insertBefore(img,row.firstChild)})}
    ['casePhotos','casePhoto'].forEach(function(id){var input=d.getElementById(id);if(input)input.addEventListener('change',function(){remember(input);setTimeout(paint,30)})});var tray=d.getElementById('caseTray');if(tray)new MutationObserver(function(){paint()}).observe(tray,{childList:true,subtree:true});paint()
  }
  function installSingleBoardDiagnostic(d){
    if(d.getElementById('singleBoardDiagnostic'))return;
    var w=d.defaultView, tray=d.getElementById('caseTray');
    var parent=tray&&tray.closest('section');
    if(!w||!parent)return;
    var panel=d.createElement('section');
    panel.id='singleBoardDiagnostic';panel.className='panel';
    panel.style.cssText='border:2px solid #ffd700;padding:18px;margin:16px 0;color:#ffd700';
    panel.innerHTML='<h2>STAGING • Single-Photo Board Diagnostic</h2><p>One board photograph. Direct /analyze test. No multi-photo merge, buyer valuation or Scrap Radar handoff.</p><input type="file" id="diagnosticBoardPhoto" accept="image/*"><button type="button" id="diagnosticBoardRun">Analyze One Board</button><p id="diagnosticBoardStatus" role="status">Choose the front photograph.</p><pre id="diagnosticBoardOutput" style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:70vh;overflow:auto"></pre>';
    parent.insertAdjacentElement('beforebegin',panel);
    var input=d.getElementById('diagnosticBoardPhoto'),button=d.getElementById('diagnosticBoardRun'),status=d.getElementById('diagnosticBoardStatus'),output=d.getElementById('diagnosticBoardOutput');
    input.addEventListener('change',function(){['diagnosticOverlay','diagnosticOverlayLegend'].forEach(function(id){var el=d.getElementById(id);if(el)el.remove()});output.textContent='';status.textContent='Ready for diagnostic analysis.'});
    button.addEventListener('click',async function(){
      output.textContent='';
      var file=input.files&&input.files[0];
      if(!file){status.textContent='Choose one photograph first.';return}
      if(!file.type.startsWith('image/')||file.size>15*1024*1024){status.textContent='Choose an image under 15 MB.';return}
      button.disabled=true;input.disabled=true;status.textContent='Analyzing one board on staging…';
      try{
        var body=new w.FormData();body.append('file',file);
        var response=await w.fetch(STAGING_API+'/analyze',{method:'POST',body:body,cache:'no-store'});
        if(!response.ok)throw new Error('HTTP '+response.status);
        var result=await response.json();
        var fields=['status','model','object_gate','board_type','board_type_reason','confidence','grade','score','grade_assessment','signals','visual','component_intelligence','power','physical_fingerprint','recommendation'];
        var report={};
        fields.forEach(function(key){if(Object.prototype.hasOwnProperty.call(result,key))report[key]=result[key]});
        status.textContent='Single-photo diagnostic response received. Inspection only.';
        var ci=result.component_intelligence||{},dg=ci.diagnostics||{},side=ci.side_context||{},vis=result.visual||{};
        var summary={board_type:result.board_type,confidence:result.confidence,grade:result.grade,score:result.score,mask_coverage_pct:dg.mask_coverage_pct,ic_like:ci.ic_like,gold_contact_count:vis.gold_contact_count,solder_side_likelihood:ci.solder_side_likelihood,body_rejected:dg.body_rejected,pin_rejected:dg.pin_rejected,face_rejected:dg.face_rejected,side_status:side.status};
        output.textContent='QUICK DIAGNOSTIC SUMMARY\n'+JSON.stringify(summary,null,2)+'\n\nREJECTED PACKAGE REGIONS (inspection only)\n'+JSON.stringify(dg.rejected_package_regions||[],null,2)+'\n\nFULL REPORT\n'+JSON.stringify(report,null,2);
        output.scrollTop=0;
        var old=d.getElementById('diagnosticOverlay');if(old)old.remove();
        var canvas=d.createElement('canvas');canvas.id='diagnosticOverlay';canvas.style.cssText='display:block;width:100%;height:auto;margin:12px 0';
        output.before(canvas);
        var url=w.URL.createObjectURL(file);
        var img=new w.Image();
        img.onload=function(){
          try{
            var scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
            canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);
            var ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
            var regions=dg.rejected_package_regions||[];
            ctx.lineWidth=Math.max(2,canvas.width/400);
            ctx.font=Math.max(14,canvas.width/55)+'px sans-serif';
            regions.forEach(function(q,i){
              if(![q.x,q.y,q.w,q.h].every(Number.isFinite))return;
              ctx.strokeStyle=q.reason==='body'?'#ff5050':q.reason==='pins'?'#ffda30':'#54e8ff';
              ctx.strokeRect(q.x,q.y,q.w,q.h);
              ctx.fillStyle=ctx.strokeStyle;ctx.fillText(String(i+1),q.x,Math.max(16,q.y-3));
            });
          }finally{w.URL.revokeObjectURL(url)}
        };
        img.onerror=function(){w.URL.revokeObjectURL(url);canvas.remove()};
        img.src=url;
        var legend=d.createElement('p');legend.id='diagnosticOverlayLegend';var prior=d.getElementById(legend.id);if(prior)prior.remove();
        legend.textContent='Candidate overlay (inspection only): red = body, yellow = pins, cyan = brightness. Preview scaled to the server working-image limit of 1600 pixels; orientation and alignment still require verification.';
        canvas.before(legend);
      }catch(e){status.textContent='Diagnostic failed: '+e.message}
      finally{button.disabled=false;input.disabled=false}
    });
  }
  function loadTray(d){add(d,'spikeCaseTrayLoader','board_case_tray.js?v=24',function(){installTrayPreviews(d);installSingleBoardDiagnostic(d)})}
  function loadSpikeDual(d){add(d,'spikeDualLoader','board_spike_dual.js?v=2')}
  function loadTargetArea(d){add(d,'targetAreaDisplayLoader','board_target_area_patch.js?v=2',function(){loadSpikeDual(d)})}
  frame.addEventListener('load',function(){try{var d=this.contentDocument;if(!d)return;installTesterAccess(d);add(d,'inspectionTargetLoader','board_inspection_target.js?v=4',function(){loadTargetArea(d)});if(d.getElementById('spikeScrapBridgeLoader')){loadTray(d);return}var b=d.createElement('script');b.id='spikeScrapBridgeLoader';b.src='board_scrap_bridge.js?v=3';b.async=false;b.onload=function(){loadTray(d)};b.onerror=function(){loadTray(d)};d.body.appendChild(b)}catch(e){console.error('Board Sense staging injection failed',e)}});
})();
</script></body></html>
