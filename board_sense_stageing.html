<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Board Sense Staging</title><style>html,body,#bs{margin:0;width:100%;height:100%;border:0;background:#050505}body{overflow:hidden}#bs{display:block}</style></head><body><iframe id="bs" src="board_sense.html?v=case24" title="Board Sense Staging"></iframe><script>
(function(){
  var frame=document.getElementById('bs');
  var STAGING_API='https://boardsense-stageing.up.railway.app';
  var TESTER_STORAGE_KEY='boardSenseTesterKeyV1';
  function add(d,id,src,onload){if(d.getElementById(id)){if(onload)onload();return}var s=d.createElement('script');s.id=id;s.src=src;s.async=false;if(onload)s.onload=onload;d.body.appendChild(s)}
  function diagnosticGate(data){var x=(data&&data.combined)||data||{};return x.same_board_verification||(x.case_analysis&&x.case_analysis.identity_gate)||x.identity||null}
  function esc(v){return String(v==null?'':v).replace(/[&<>]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]})}
  function isIndependentWholeRequest(r){return !!r&&(r.request_type==='independent_whole_board_identity_photo'||r.detector_reason==='insufficient_independent_whole_board_evidence')}
  function showDiagnostics(d,data){
    var old=d.getElementById('stagingFrameDiagnostics');if(old)old.remove();
    var gate=diagnosticGate(data);if(!gate)return;
    if(gate.status==='IDENTITY_CLARIFICATION_NEEDED'){
      var request=(gate.requested_photos&&gate.requested_photos[0])||{};
      var instruction=request.instruction||gate.identity_next_step||'Add the targeted identity photo SPIKE requested.';
      var independentWhole=isIndependentWholeRequest(request);
      setTimeout(function(){
        var u=d.getElementById('uploadStatus');if(u)u.textContent='Identity clarification needed. '+instruction;
        var p=d.getElementById('predictionBox');
        if(p){
          if(independentWhole){
            p.innerHTML='<div class="decision-box"><h3>📸 SPIKE NEEDS A GENUINELY NEW VIEW</h3><b>No same-board approval yet.</b><br>The current uploads do not provide two independent usable whole-board identity views. Crops, digital zooms, and near-duplicate views may help inspection, but they do not count as separate physical witnesses.<br><br><b>Next photo:</b> '+esc(instruction)+'<br><br><span class="muted">Board grading stays paused until identity is settled.</span></div>';
          }else{
            p.innerHTML='<div class="decision-box"><h3>📸 SPIKE NEEDS ONE BETTER VIEW</h3><b>No multiple-board claim yet.</b><br>SPIKE found a narrow-neck shape ambiguity, but not enough independent evidence to call this two boards.<br><br><b>Next photo:</b> '+esc(instruction)+'<br><br><span class="muted">Board grading stays paused until identity is settled.</span></div>';
          }
        }
      },250);
    }
    var blocks=gate.frame_blocks||[];
    var panel=d.createElement('div');panel.id='stagingFrameDiagnostics';
    panel.style.cssText='position:fixed;left:10px;right:10px;bottom:62px;z-index:99998;max-height:42vh;overflow:auto;background:#080808;color:#e8e8e8;border:1px solid #ffd700;border-radius:12px;padding:10px 12px;font:12px/1.4 monospace;box-shadow:0 0 18px rgba(255,215,0,.25)';
    var html='<div style="display:flex;justify-content:space-between;gap:10px"><b style="color:#ffd700">🔬 STAGING FRAME DIAGNOSTICS</b><button id="stagingDiagClose" type="button">×</button></div>';
    html+='<div>Status: '+esc(gate.status||'checked')+' • blocked: '+String(!!gate.block_reconciliation)+'</div>';
    if(gate.status==='IDENTITY_CLARIFICATION_NEEDED'){
      var requests=gate.requested_photos||[];
      var independentLabel=requests.some(isIndependentWholeRequest);
      html+='<div style="margin-top:6px;color:#ffd700"><b>'+(independentLabel?'INDEPENDENT VIEW REQUEST':'CLARIFICATION REQUEST')+'</b></div>';
      requests.forEach(function(r){var prefix=r.flagged_view!=null?'Photo '+esc(r.flagged_view)+': ':'';html+='<div>'+prefix+esc(r.instruction||'Add the requested identity photo.')+'</div>'});
    }
    if(!blocks.length)html+='<div>No blocked frame diagnostics were returned.</div>';
    blocks.forEach(function(b,n){
      var fg=b.frame_identity_gate||b.gate||b||{},m=fg.metrics||{},ev=fg.evidence||[];
      html+='<hr><b>Photo '+esc(b.view!=null?b.view:n+1)+'</b> • '+esc(fg.status||'flagged')+' • detector '+esc(fg.version||fg.detector_version||'n/a');
      html+='<br><b>TRIGGERS</b> two-region='+String(!!m.base_two_region_trigger)+' | bottleneck='+String(!!m.bottleneck_split_trigger)+' | multiscale='+String(!!m.multiscale_split_trigger)+' | secondary-plane='+String(!!m.secondary_plane_trigger);
      if(m.multiscale_split_kernel!=null)html+=' (kernel '+esc(m.multiscale_split_kernel)+')';
      html+='<br><b>MEASUREMENTS</b><pre style="white-space:pre-wrap;margin:4px 0">'+esc(JSON.stringify(m,null,2))+'</pre>';
      if(ev.length)html+='<b>EVIDENCE</b><br>'+ev.map(function(x){return '• '+esc(x)}).join('<br>');
    });
    var combined=(data&&data.combined)||{},tool=combined.spike_tool_use||null,views=(data&&data.views)||[];
    if(views.length){html+='<hr><b style="color:#7dff7d">PHYSICAL FINGERPRINTS</b>';views.forEach(function(v,i){var fp=v.physical_fingerprint||{};html+='<br><b>Photo '+esc(v.view_number||i+1)+'</b> coverage='+esc(fp.coverage||'n/a')+' quality='+esc(fp.geometry_quality||'n/a')+' aspect='+esc(fp.board_aspect==null?'n/a':fp.board_aspect)+' holes='+esc(fp.hole_count==null?'n/a':fp.hole_count)+' landmarks='+esc(fp.landmark_count==null?'n/a':fp.landmark_count)})}
    if(tool){
      html+='<hr><b style="color:#00d4ff">SPIKE TOOL USE</b><br>Status: '+esc(tool.status||'n/a')+'<br>Used: '+esc((tool.tools_used||[]).join(', ')||'none')+'<br>Identity override: '+String(!!tool.identity_override);
      if(tool.independent_whole_view_count!=null)html+='<br>Independent whole-board views: '+esc(tool.independent_whole_view_count);
      if((tool.non_independent_view_pairs||[]).length)html+='<br>Non-independent pairs: '+esc(JSON.stringify(tool.non_independent_view_pairs));
      var searches=tool.web_reference_searches||[];
      searches.forEach(function(s,i){html+='<br><br><b>Web search photo '+esc(s.view||i+1)+'</b> • '+esc(s.status||'n/a');if(s.query)html+='<br>Query: '+esc(s.query);(s.matches||[]).slice(0,3).forEach(function(m){html+='<br>• '+esc(m.title||'untitled')+(m.source?' ['+esc(m.source)+']':'')});if(s.error)html+='<br>Error: '+esc(s.error)});
      if(tool.reference_consensus){html+='<br><br><b>Reference consensus:</b> '+esc(tool.reference_consensus.support||tool.reference_consensus.status||'n/a');if((tool.reference_consensus.common_tokens||[]).length)html+='<br>Common terms: '+esc(tool.reference_consensus.common_tokens.join(', '))}
    }
    panel.innerHTML=html;d.body.appendChild(panel);var x=d.getElementById('stagingDiagClose');if(x)x.onclick=function(){panel.remove()};
  }
  function installTesterAccess(d){
    var w=d.defaultView;if(!w)return;w.API=STAGING_API;
    if(!w.__boardSenseTesterFetchPatched){var originalFetch=w.fetch.bind(w);w.fetch=function(input,init){init=init||{};var key='';try{key=w.localStorage.getItem(TESTER_STORAGE_KEY)||''}catch(_){}if(key){var headers=new w.Headers(init.headers||{});headers.set('x-board-sense-tester-key',key);init.headers=headers}var requestUrl=typeof input==='string'?input:(input&&input.url)||'';return originalFetch(input,init).then(function(res){if(String(requestUrl).indexOf('/analyze-case')>=0){try{res.clone().json().then(function(data){showDiagnostics(d,data)}).catch(function(){})}catch(_){}}return res})};w.__boardSenseTesterFetchPatched=true}
    if(d.getElementById('boardSenseTesterAccessBtn'))return;
    var btn=d.createElement('button');btn.id='boardSenseTesterAccessBtn';btn.type='button';var saved='';try{saved=w.localStorage.getItem(TESTER_STORAGE_KEY)||''}catch(_){}btn.textContent=saved?'✅ STAGING • Tester Access Saved':'🧪 STAGING • Tester Access';btn.style.cssText='position:fixed;right:12px;bottom:12px;z-index:99999;padding:10px 14px;border-radius:12px;border:1px solid #ffd700;background:#111;color:#ffd700;font-weight:700;box-shadow:0 0 14px rgba(255,215,0,.35)';btn.onclick=function(){var existing='';try{existing=w.localStorage.getItem(TESTER_STORAGE_KEY)||''}catch(_){}var entered=w.prompt(existing?'Tester access is already saved. Enter a NEW key to replace it. Leave blank to keep it. Type CLEAR to disable.':'Enter the Board Sense tester key.','');if(entered===null)return;entered=String(entered).trim();try{if(existing&&!entered){btn.textContent='✅ STAGING • Tester Access Saved';return}if(entered.toUpperCase()==='CLEAR'){w.localStorage.removeItem(TESTER_STORAGE_KEY);btn.textContent='🧪 STAGING • Tester Access';return}if(entered){w.localStorage.setItem(TESTER_STORAGE_KEY,entered);btn.textContent='✅ STAGING • Tester Access Saved'}}catch(_){w.alert('Tester key could not be saved on this browser.')}};d.body.appendChild(btn)
  }
  function installTrayPreviews(d){
    if(d.__stagingTrayPreviewsInstalled)return;d.__stagingTrayPreviewsInstalled=true;var urls={};
    function remember(input){Array.prototype.forEach.call((input&&input.files)||[],function(file){try{if(urls[file.name])URL.revokeObjectURL(urls[file.name]);urls[file.name]=URL.createObjectURL(file)}catch(_){}})}
    function paint(){var tray=d.getElementById('caseTray');if(!tray)return;Array.prototype.forEach.call(tray.querySelectorAll('.blueprint-item'),function(row){if(row.querySelector('.staging-file-preview'))return;var title=row.querySelector('.blueprint-title');var name=title?String(title.textContent||'').trim():'';if(!name||!urls[name])return;var img=d.createElement('img');img.className='staging-file-preview';img.src=urls[name];img.alt=name;img.style.cssText='width:88px;height:66px;object-fit:cover;border:1px solid #39ff14;border-radius:8px;margin-right:10px;vertical-align:middle;background:#111';row.insertBefore(img,row.firstChild)})}
    ['casePhotos','casePhoto'].forEach(function(id){var input=d.getElementById(id);if(input)input.addEventListener('change',function(){remember(input);setTimeout(paint,30)})});var tray=d.getElementById('caseTray');if(tray)new MutationObserver(function(){paint()}).observe(tray,{childList:true,subtree:true});paint()
  }
  function loadTray(d){add(d,'spikeCaseTrayLoader','board_case_tray.js?v=13',function(){installTrayPreviews(d)})}
  function loadSpikeDual(d){add(d,'spikeDualLoader','board_spike_dual.js?v=2')}
  function loadTargetArea(d){add(d,'targetAreaDisplayLoader','board_target_area_patch.js?v=2',function(){loadSpikeDual(d)})}
  frame.addEventListener('load',function(){try{var d=this.contentDocument;if(!d)return;installTesterAccess(d);add(d,'inspectionTargetLoader','board_inspection_target.js?v=4',function(){loadTargetArea(d)});if(d.getElementById('spikeScrapBridgeLoader')){loadTray(d);return}var b=d.createElement('script');b.id='spikeScrapBridgeLoader';b.src='board_scrap_bridge.js?v=3';b.async=false;b.onload=function(){loadTray(d)};b.onerror=function(){loadTray(d)};d.body.appendChild(b)}catch(e){console.error('Board Sense staging injection failed',e)}});
})();
</script></body></html>
